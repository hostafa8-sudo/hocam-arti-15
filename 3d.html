<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Nitro Race - Muhammed Mustafa Bağışladı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body {
            background-color: #0f172a; color: #f8fafc;
            font-family: "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 15px; user-select: none; -webkit-user-select: none;
        }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 4px; font-size: 1.8rem; }
        .author-badge {
            background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8;
            padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold;
            margin-bottom: 15px; text-align: center;
        }
        #game-container {
            position: relative; width: 100%; max-width: 380px; height: 380px;
            border: 2px solid #334155; border-radius: 12px; overflow: hidden;
            background: #000;
        }
        #hud {
            position: absolute; top: 10px; left: 10px; color: #38bdf8;
            font-size: 1.2rem; font-weight: bold; z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        #game-over-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; display: none;
        }
        #game-over-ui h2 { color: #ef4444; font-size: 2rem; margin-bottom: 10px; }
        .controls { display: flex; gap: 15px; margin-top: 15px; width: 100%; max-width: 380px; }
        .ctrl-btn {
            flex: 1; background: #334155; color: white; border: none;
            padding: 15px; border-radius: 8px; font-size: 1.3rem; font-weight: bold; cursor: pointer;
        }
        button.action-btn {
            margin-top: 15px; padding: 12px 24px; background: #22c55e;
            color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem;
        }
        .back-link {
            margin-top: 15px; color: #38bdf8; text-decoration: none; font-weight: bold; font-size: 0.9rem;
        }
        footer { margin-top: 20px; font-size: 0.75rem; color: #64748b; text-align: center; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>🎮 3D Araba Yarışı</h1>
    <div class="author-badge">👑 Geliştirici: Muhammed Mustafa Bağışladı (No: 438)</div>

    <div id="game-container">
        <div id="hud">Skor: <span id="score">0</span></div>
        <div id="game-over-ui">
            <h2>KAZA YAPTIN!</h2>
            <button class="action-btn" onclick="resetGame()">Yeniden Başlat</button>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" onclick="moveCar(-1)">⬅️ Sol</button>
        <button class="ctrl-btn" onclick="moveCar(1)">Sağ ➡️</button>
    </div>

    <a href="/" class="back-link">⬅️ Ana Oyun Portalına Dön</a>

    <footer>
        © 2026 Tasarım & Kodlama: Muhammed Mustafa Bağışladı (No: 438)<br>Tüm Hakları Saklıdır.
    </footer>

    <script>
        let scene, camera, renderer;
        let playerCar, obstacles = [];
        let lanes = [-2, 0, 2];
        let currentLane = 1;
        let score = 0, speed = 0.3;
        let isGameActive = false;
        let animId;

        function init3D() {
            const container = document.getElementById('game-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 10, 50);

            camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
            camera.position.set(0, 3, 7);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(376, 376);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            const roadGeo = new THREE.PlaneGeometry(8, 100);
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -40;
            scene.add(road);

            playerCar = createCar(0x38bdf8);
            scene.add(playerCar);

            resetGame();
        }

        function createCar(colorHex) {
            const carGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(1.2, 0.5, 2);
            const bodyMat = new THREE.MeshLambertMaterial({ color: colorHex });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.25;
            carGroup.add(body);

            const cabinGeo = new THREE.BoxGeometry(0.9, 0.4, 1);
            const cabinMat = new THREE.MeshLambertMaterial({ color: 0x0f172a });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.6, -0.1);
            carGroup.add(cabin);

            return carGroup;
        }

        function moveCar(dir) {
            if(!isGameActive) return;
            currentLane += dir;
            if(currentLane < 0) currentLane = 0;
            if(currentLane > 2) currentLane = 2;
        }

        function spawnObstacle() {
            const laneIdx = Math.floor(Math.random() * 3);
            const obstacle = createCar(0xef4444);
            obstacle.position.set(lanes[laneIdx], 0, -40);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function resetGame() {
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];
            currentLane = 1;
            score = 0;
            speed = 0.35;
            isGameActive = true;
            document.getElementById('score').innerText = score;
            document.getElementById('game-over-ui').style.display = 'none';
            if(animId) cancelAnimationFrame(animId);
            animate();
        }

        function animate() {
            if (!isGameActive) return;

            animId = requestAnimationFrame(animate);

            playerCar.position.x += (lanes[currentLane] - playerCar.position.x) * 0.2;

            if (Math.random() < 0.03) spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += speed;

                const dx = Math.abs(playerCar.position.x - obstacles[i].position.x);
                const dz = Math.abs(playerCar.position.z - obstacles[i].position.z);

                if (dx < 1.0 && dz < 1.5) {
                    isGameActive = false;
                    document.getElementById('game-over-ui').style.display = 'flex';
                }

                if (obstacles[i].position.z > 5) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                    score += 10;
                    speed += 0.005;
                    document.getElementById('score').innerText = score;
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveCar(-1);
            if (e.key === 'ArrowRight') moveCar(1);
        });

        window.onload = init3D;
    </script>
</body>
</html>
